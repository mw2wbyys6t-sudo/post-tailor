<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="方向 B：一稿分流">
  <title>方向 B · 一稿分流</title>
  <!-- 概念：上方一条实心横杠＝一稿（也对应「千」字的第一笔），
       下方三条不等长分支＝发到不同平台后各自成形的版本 -->
  <path d="M128 0 H896 L1024 128 V896 L896 1024 H128 L0 896 V128 Z" fill="#F7F4EC" />

  <!-- 一：稿 -->
  <rect x="228" y="286" width="568" height="78" rx="39" fill="#16211F" />
  <!-- 十：主干 -->
  <rect x="473" y="364" width="78" height="186" rx="39" fill="#16211F" />

  <!-- 分流：三条长度与角度都不同的去向 -->
  <g fill="none" stroke="#C27803" stroke-linecap="round">
    <path d="M512 550 L286 706" stroke-width="78" />
    <path d="M512 550 L512 792" stroke-width="74" />
    <path d="M512 550 L746 668" stroke-width="70" />
  </g>
</svg>
