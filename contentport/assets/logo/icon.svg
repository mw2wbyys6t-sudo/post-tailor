<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="一稿千面 OmniDraft 标志">
  <title>OmniDraft · 一稿千面</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12857B" />
      <stop offset="0.55" stop-color="#0F766E" />
      <stop offset="1" stop-color="#0A544E" />
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.9" r="0.75">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.34" />
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#F4FBF9" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#052420" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 底板 -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)" />
  <rect width="1024" height="1024" rx="224" fill="url(#glow)" />

  <!-- 稿纸主体：整体放大，保证 32–64px 下仍可辨认 -->
  <g transform="translate(512 512) scale(1.14) translate(-512 -512)">
  <!-- 三层稿纸：一稿 -> 多面 -->
  <g filter="url(#soft)">
    <rect x="252" y="210" width="400" height="500" rx="46" fill="#FFFFFF" opacity="0.18" />
    <rect x="312" y="262" width="400" height="500" rx="46" fill="#FFFFFF" opacity="0.34" />
    <rect x="372" y="314" width="400" height="500" rx="46" fill="url(#paper)" />
  </g>

  <!-- 正文行 + 平台强调色 -->
  <g>
    <rect x="412" y="404" width="136" height="20" rx="10" fill="#C27803" opacity="0.92" />
    <rect x="412" y="456" width="300" height="15" rx="7.5" fill="#0F766E" opacity="0.28" />
    <rect x="412" y="504" width="250" height="15" rx="7.5" fill="#0F766E" opacity="0.28" />
    <rect x="412" y="552" width="282" height="15" rx="7.5" fill="#0F766E" opacity="0.24" />
    <rect x="412" y="600" width="210" height="15" rx="7.5" fill="#0F766E" opacity="0.2" />
    <rect x="412" y="648" width="158" height="15" rx="7.5" fill="#0F766E" opacity="0.14" />
  </g>

  <!-- 一点星芒：灵感/生成 -->
  <path d="M700 348
           Q708.8 383.2 744 392
           Q708.8 400.8 700 436
           Q691.2 400.8 656 392
           Q691.2 383.2 700 348 Z"
        fill="#E8A33D" />
  </g>
</svg>
