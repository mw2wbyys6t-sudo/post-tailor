<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="OmniDraft 一稿千面 标志">
  <title>OmniDraft · 一稿千面</title>
  <!--
    一条纸带反复对折：还是同一张纸，却折出多个面。
    受光面（纸白）与背光面（灰绿）交替，表达同一内容在不同平台上的不同形态；
    右侧一道琥珀折边，表示「还要继续折下去」。
  -->
  <path d="M128 0 H896 L1024 128 V896 L896 1024 H128 L0 896 V128 Z" fill="#16211F" />

  <g>
    <path d="M212 392 L410 302 L410 594 L212 684 Z" fill="#F5F2EB" />
    <path d="M410 302 L608 392 L608 684 L410 594 Z" fill="#BFD4CD" />
    <path d="M608 392 L806 302 L806 594 L608 684 Z" fill="#F5F2EB" />
  </g>

  <path d="M806 302 L806 594" stroke="#E8A33D" stroke-width="20" stroke-linecap="round" />
</svg>
